id: cybernova-lab-hsts-header-check

info:
  name: Lab HTTP Strict-Transport-Security header review
  author: Cybernova
  severity: info
  description: Observes an absent HSTS header on a lab response; not a vulnerability proof.
  tags: lab,misconfig,headers

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: word
        part: header
        words:
          - "Strict-Transport-Security:"
        negative: true
