services:
  webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    network_mode: host
    environment:
      HOST: "127.0.0.1"
      PORT: "18791"
      OLLAMA_BASE_URL: "http://127.0.0.1:11434"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY}"
      WEBUI_AUTH: "True"
      ENABLE_SIGNUP: "True"
      DATA_DIR: "/app/backend/data"
    volumes:
      - cybernova_webui_data:/app/backend/data
volumes:
  cybernova_webui_data:
