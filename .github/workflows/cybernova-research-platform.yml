name: Cybernova Research Platform Quality Gate
on:
  push:
    branches:
      - main
      - feature/cybernova-audit-architecture
      - feature/cybernova-chat-console
      - feature/account-gpt-local-tools
      - feature/full-shell-computer-discovery
      - feature/owner-input-account-operator
      - fix/chat-diagnostics-and-context
    paths:
      - AGENTS.md
      - cybernova/research-platform/**
      - tools/chatgpt-terminal-paste/**
      - tools/windows/**
      - .github/workflows/cybernova-research-platform.yml
  pull_request:
    paths:
      - AGENTS.md
      - cybernova/research-platform/**
      - tools/chatgpt-terminal-paste/**
      - tools/windows/**
      - .github/workflows/cybernova-research-platform.yml
concurrency:
  group: cybernova-research-platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portable runtime dependencies
        run: python -m pip install -r cybernova/research-platform/console/requirements.txt
      - name: Prevent committing private Cybernova data and model weights
        run: python cybernova/research-platform/portable/repo_guard.py
      - name: Compile new project source
        run: python -m compileall -q cybernova/research-platform
      - name: Parse frontend and ChatGPT extension JavaScript
        run: |
          node --check cybernova/research-platform/console/static/app.js
          node --check tools/chatgpt-terminal-paste/content.js
      - name: Run offline policy, evidence, WAK research and installer unit tests
        run: python -m unittest discover -s cybernova/research-platform/tests -p 'test_*.py' -v
      - name: Validate portable deployment on a fresh machine
        run: |
          cd cybernova/research-platform/portable
          python manage.py init --provider ollama --model qwen2.5-coder:7b
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.gpu.yaml --profile local-ollama config -q
          cd ../../..
          docker build -t cybernova-portable:ci -f cybernova/research-platform/portable/Dockerfile .
      - name: Check tool registry and dry-run installation inventory
        run: |
          python cybernova/research-platform/cli.py catalog > /tmp/cybernova-catalog-check.json
          python cybernova/research-platform/cli.py engagement > /tmp/cybernova-engagement-check.json
          python cybernova/research-platform/install_arsenal.py --profile all > /tmp/cybernova-engine-inventory.json
          python cybernova/research-platform/install_arsenal.py --profile baseline > /tmp/cybernova-install-dry-run.json
          python cybernova/research-platform/cli.py workflow > /tmp/cybernova-wak-workflow.json
      - name: Assert catalog sizes and default-closed state
        run: |
          python - <<'PY'
          import json
          c=json.load(open('/tmp/cybernova-catalog-check.json'))
          a=json.load(open('/tmp/cybernova-engine-inventory.json'))
          e=json.load(open('/tmp/cybernova-engagement-check.json'))
          assert c['valid'] and c['count']==89, c
          assert a['selected']==107, a['selected']
          w=json.load(open('/tmp/cybernova-wak-workflow.json'))
          assert w['ok'] and len(w['phases'])==12, w
          assert w['execution']=='disabled', w
          assert all(not phase['automatically_executable'] for phase in w['phases']), w
          assert not e['approved'], e
          assert all(not row['execution_enabled'] for row in a['engines'])
          print('CATALOG_AND_SCOPE_CI_OK')
          PY

  patchright-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser runtime dependencies
        run: python -m pip install -r cybernova/research-platform/console/requirements.txt
      - name: Install Patchright Chromium
        run: python -m patchright install --with-deps chromium
      - name: Execute local synthetic registration through the agent runtime
        env:
          CYBERNOVA_LIVE_BROWSER_SMOKE: '1'
        run: python -m unittest discover -s cybernova/research-platform/tests -p test_patchright_live_smoke.py -v

  windows-unit-and-patchright:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned runtime dependencies
        run: python -m pip install -r cybernova/research-platform/console/requirements.txt
      - name: Compile Python
        run: python -m compileall -q cybernova/research-platform
      - name: Run full Windows unit tests
        run: python -m unittest discover -s cybernova/research-platform/tests -p 'test_*.py' -v
      - name: Install Patchright Chromium
        run: python -m patchright install chromium
      - name: Execute real Windows browser registration smoke
        env:
          CYBERNOVA_LIVE_BROWSER_SMOKE: '1'
        run: python -m unittest discover -s cybernova/research-platform/tests -p test_patchright_live_smoke.py -v
