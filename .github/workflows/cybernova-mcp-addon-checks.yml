name: Cybernova MCP addon checks
on:
  push:
    branches: [cybernova-autodeploy, feature/cybernova-session-control]
    paths:
      - 'cybernova/mcp-addon/**'
      - '.github/workflows/cybernova-mcp-addon-checks.yml'
  pull_request:
    paths:
      - 'cybernova/mcp-addon/**'
      - '.github/workflows/cybernova-mcp-addon-checks.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MCP SDK v2 for protocol tests
        run: python -m pip install -r cybernova/mcp-addon/requirements-mcp.txt
      - name: Compile addon
        run: python -m compileall -q cybernova/mcp-addon
      - name: Unit tests
        working-directory: cybernova/mcp-addon
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n cybernova/mcp-addon/install.sh
