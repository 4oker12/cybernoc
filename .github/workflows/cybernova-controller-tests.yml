name: Cybernova Controller Handshake Tests

on:
  push:
    branches: [cybernova-autodeploy]
    paths:
      - 'cybernova/control/**'
      - '.github/workflows/cybernova-controller-tests.yml'
  pull_request:
    paths:
      - 'cybernova/control/**'
      - '.github/workflows/cybernova-controller-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit test echo controller
        run: python -m unittest discover -s cybernova/control/tests -v
      - name: Compile check
        run: python -m py_compile cybernova/control/handshake.py
