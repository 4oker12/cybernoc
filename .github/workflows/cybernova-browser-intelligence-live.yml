name: Cybernova Browser Intelligence Live Fixtures
on:
  pull_request:
    paths:
      - cybernova/research-platform/console/browser_control.py
      - cybernova/research-platform/console/browser_backend.py
      - cybernova/research-platform/console/requirements.txt
      - cybernova/research-platform/console/browser_intelligence.py
      - cybernova/research-platform/tests/test_browser_intelligence.py
      - .github/workflows/cybernova-browser-intelligence-live.yml
concurrency:
  group: cybernova-browser-live-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  chromium-fixtures:
    name: Chromium fixtures (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        backend: [patchright, playwright]
    env:
      CYBERNOVA_TEST_BROWSER_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r cybernova/research-platform/console/requirements.txt
      - name: Install actual Chromium for selected backend
        run: |
          python -m playwright install-deps chromium
          python -m "$CYBERNOVA_TEST_BROWSER_BACKEND" install chromium
      - name: Verify selected Chromium executable
        run: |
          python - <<'PY'
          import os
          from importlib import import_module
          from pathlib import Path
          backend = os.environ["CYBERNOVA_TEST_BROWSER_BACKEND"]
          sync_playwright = import_module(backend + ".sync_api").sync_playwright
          with sync_playwright() as p:
              assert Path(p.chromium.executable_path).is_file()
              browser = p.chromium.launch(headless=True)
              print(backend, browser.version)
              browser.close()
          PY
      - name: Browser intelligence tests with localhost fixtures
        run: python -m unittest discover -s cybernova/research-platform/tests -p test_browser_intelligence.py -v
