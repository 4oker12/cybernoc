name: Cybernova Browser Intelligence Live Fixtures
on:
  pull_request:
    paths:
      - cybernova/research-platform/console/browser_control.py
      - cybernova/research-platform/console/browser_intelligence.py
      - cybernova/research-platform/tests/test_browser_intelligence.py
      - .github/workflows/cybernova-browser-intelligence-live.yml
concurrency:
  group: cybernova-browser-live-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  chromium-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r cybernova/research-platform/console/requirements.txt
      - name: Install actual Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify Chromium executable
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              assert Path(p.chromium.executable_path).is_file()
              browser = p.chromium.launch(headless=True)
              browser.close()
          PY
      - name: Browser intelligence tests with localhost fixtures
        run: python -m unittest discover -s cybernova/research-platform/tests -p test_browser_intelligence.py -v
