name: Cybernova Portable Installer Checks
on:
  push:
    branches: ["feature/cybernova-portable-launch"]
    paths:
      - "install.sh"
      - "install.ps1"
      - "cybernova/research-platform/portable/**"
      - ".github/workflows/cybernova-portable-install-checks.yml"
  pull_request:
    paths:
      - "install.sh"
      - "install.ps1"
      - "cybernova/research-platform/portable/**"
      - ".github/workflows/cybernova-portable-install-checks.yml"
permissions:
  contents: read
jobs:
  syntax-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n install.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Python manager syntax
        run: python3 -m py_compile cybernova/research-platform/portable/manage.py
      - name: Generate disposable local config
        working-directory: cybernova/research-platform/portable
        run: python3 manage.py init --provider ollama --model qwen2.5-coder:7b
      - name: Validate Compose syntax (no containers started)
        working-directory: cybernova/research-platform/portable
        run: docker compose -f compose.yaml --profile local-ollama config --quiet
