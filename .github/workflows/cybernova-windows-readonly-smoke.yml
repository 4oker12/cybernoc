name: Cybernova Windows Readonly Integration Smoke
on:
  push:
    branches:
      - feature/account-gpt-local-tools
      - feature/full-shell-computer-discovery
      - feature/unified-collaboration-orchestrator
    paths:
      - cybernova/research-platform/**
      - AGENTS.md
      - .github/workflows/cybernova-windows-readonly-smoke.yml

concurrency:
  group: cybernova-windows-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-real-tool-smoke:
    name: Shared GPT/DeepSeek tools on ephemeral Windows runner
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Cybernova Windows dependencies
        shell: pwsh
        run: python -m pip install -r cybernova/research-platform/console/requirements.txt
      - name: Install isolated Playwright Chromium
        shell: pwsh
        run: python -m playwright install chromium
      - name: Execute READ-ONLY shared-tool smoke
        shell: pwsh
        env:
          CYBERNOVA_GPT_BROWSER_EPHEMERAL: "1"
          CYBERNOVA_GPT_BROWSER_HEADLESS: "1"
        run: python cybernova/research-platform/tests/windows_readonly_smoke.py
